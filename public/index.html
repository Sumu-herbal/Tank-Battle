<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星核战纪：元素共鸣</title>
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
body{display:flex;justify-content:center;align-items:center;font-family:'Segoe UI','PingFang SC',sans-serif;}

/* ===== 9:16 游戏容器 ===== */
#game-wrap{position:relative;aspect-ratio:9/16;max-height:100vh;max-width:100vw;overflow:hidden;background:radial-gradient(ellipse at center,#0a0a2e 0%,#000010 100%);}
#game-wrap.landscape{aspect-ratio:16/9;} /* PC 备用 */

/* ===== Canvas ===== */
#gc{display:block;width:100%;height:100%;}

/* ===== UI 叠加层 ===== */
#ui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:space-between;}

/* ---- 顶部 HUD ---- */
#hud-top{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;}
#hud-score{color:#ffe080;font-size:clamp(12px,3vw,18px);font-weight:700;text-shadow:0 0 8px rgba(255,224,128,0.5);letter-spacing:1px;}
#hud-wave{color:#80d0ff;font-size:clamp(10px,2.5vw,14px);text-shadow:0 0 6px rgba(128,208,255,0.5);text-align:right;}
.hud-label{font-size:0.65em;opacity:0.6;}

/* ---- 底部控制区 ---- */
#hud-bottom{display:flex;flex-direction:column;align-items:center;padding:8px 12px 16px;gap:8px;}

/* 大招能量条 */
#ultimate-bar-wrap{width:80%;height:clamp(6px,1.5vw,10px);background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
#ultimate-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff4444,#ff8800,#ffe040);border-radius:10px;transition:width 0.2s;box-shadow:0 0 10px rgba(255,136,0,0.6);}
#ultimate-bar-fill.ready{animation:ultPulse 0.5s ease-in-out infinite;}
@keyframes ultPulse{0%,100%{box-shadow:0 0 10px rgba(255,136,0,0.6);}50%{box-shadow:0 0 24px rgba(255,200,0,1);}}

/* 底部按钮 */
#btns{display:flex;justify-content:space-between;align-items:center;width:100%;pointer-events:auto;}
.btn-elem{width:clamp(48px,12vw,64px);height:clamp(48px,12vw,64px);border-radius:50%;border:2px solid rgba(255,255,255,0.3);font-size:clamp(20px,5vw,28px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;background:rgba(0,0,0,0.5);}
.btn-elem:active{transform:scale(0.9);}
#btn-fire{background:rgba(255,60,20,0.3);border-color:rgba(255,100,60,0.7);box-shadow:0 0 20px rgba(255,60,20,0.4);}
#btn-fire.active{background:rgba(255,40,0,0.6);box-shadow:0 0 35px rgba(255,60,20,0.9);border-color:#ff6030;}
#btn-ice{background:rgba(20,100,255,0.3);border-color:rgba(80,160,255,0.7);box-shadow:0 0 20px rgba(20,100,255,0.4);}
#btn-ice.active{background:rgba(0,60,255,0.6);box-shadow:0 0 35px rgba(20,100,255,0.9);border-color:#4080ff;}
#btn-ult{width:clamp(56px,14vw,72px);height:clamp(56px,14vw,72px);border-radius:50%;background:rgba(255,120,0,0.2);border:3px solid rgba(255,180,0,0.4);font-size:clamp(24px,6vw,32px);display:none;align-items:center;just-content:center;cursor:pointer;transition:all 0.2s;}
#btn-ult.show{display:flex;animation:ultPulse 0.5s ease-in-out infinite;}
#btn-ult:active{transform:scale(0.85);background:rgba(255,180,0,0.5);}

/* 元素状态指示器 */
#elem-indicator{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:clamp(6px,1.5vw,10px);height:clamp(60px,15vw,100px);border-radius:10px;transition:background 0.3s;}
#elem-indicator.fire{background:linear-gradient(to bottom,#ff6020,#ff2000);box-shadow:0 0 15px rgba(255,60,20,0.6);}
#elem-indicator.ice{background:linear-gradient(to bottom,#4080ff,#1040dd);box-shadow:0 0 15px rgba(20,100,255,0.6);}

/* 消息提示 */
#msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:clamp(14px,3.5vw,20px);font-weight:700;text-shadow:0 0 10px rgba(255,255,255,0.7);pointer-events:none;opacity:0;transition:opacity 0.3s;}
#msg.show{opacity:1;}

/* 游戏结束 */
#gameover{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;flex-direction:column;justify-content:center;align-items:center;gap:16px;z-index:20;}
#gameover.show{display:flex;}
#gameover h2{font-size:clamp(24px,6vw,36px);color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.5);}
#gameover .score{font-size:clamp(16px,4vw,24px);color:#ffe080;}
#btn-restart{padding:12px 32px;border-radius:30px;background:linear-gradient(135deg,#ff6020,#ff2080);color:#fff;font-size:clamp(14px,3.5vw,18px);font-weight:700;border:none;cursor:pointer;pointer-events:auto;letter-spacing:1px;}
#btn-restart:active{transform:scale(0.95);}

/* PC 端键盘提示 */
#keys-hint{position:absolute;bottom:50%;left:8px;color:rgba(255,255,255,0.3);font-size:10px;pointer-events:none;display:flex;flex-direction:column;gap:4px;}
@media (pointer:coarse){#keys-hint{display:none;}}
@media (pointer:fine){#btns{display:none;}}

/* 竖屏旋转提示 */
#rotate-hint{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:999;flex-direction:column;justify-content:center;align-items:center;gap:12px;color:#fff;font-size:18px;}
@media (orientation:landscape) and (max-width:600px){#rotate-hint{display:flex;}}
</style>
</head>
<body>

<div id="rotate-hint">📱↻<br>请旋转设备至竖屏模式</div>

<div id="game-wrap">
  <canvas id="gc"></canvas>

  <!-- 元素指示器 -->
  <div id="elem-indicator" class="fire"></div>

  <!-- 消息提示 -->
  <div id="msg"></div>

  <div id="ui">
    <!-- 顶部 HUD -->
    <div id="hud-top">
      <div>
        <div id="hud-score">🏆 0</div>
        <div class="hud-label">SCORE</div>
      </div>
      <div>
        <div id="hud-wave">WAVE 1</div>
        <div class="hud-label">FIRESTORM</div>
      </div>
    </div>

    <!-- 底部 -->
    <div id="hud-bottom">
      <div id="ultimate-bar-wrap"><div id="ultimate-bar-fill"></div></div>
      <div id="btns">
        <button class="btn-elem active" id="btn-fire">🔥</button>
        <button id="btn-ult">⚡</button>
        <button class="btn-elem" id="btn-ice">❄️</button>
      </div>
      <div id="keys-hint">
        <span>WASD/方向键: 移动</span>
        <span>空格/J: 切换元素</span>
        <span>K: 释放大招</span>
      </div>
    </div>
  </div>

  <!-- 游戏结束 -->
  <div id="gameover">
    <h2>💥 战机陨落</h2>
    <div class="score" id="final-score">最终得分: 0</div>
    <button id="btn-restart" onclick="restartGame()">🔄 再次出击</button>
  </div>
</div>

<script>
// ============================================================
//  星核战纪：元素共鸣  -  单文件 HTML5 Canvas 原型
// ============================================================

// ── 常量 ────────────────────────────────────────────────────
const W = 540, H = 960; // 9:16 设计分辨率
const PLAYER_SPD = 6;
const BULLET_SPD = 8;
const ENEMY_BULLET_SPD = 3.5;
const ENEMY_SPAWN_RATE = 60; // 帧
const ABSORB_RANGE = 28;    // 吸收判定半径
const ULT_CHARGE_PER_BULLET = 6; // 每颗同色弹充能量 (%)
const ULT_DURATION = 300;   // 大招持续时间(帧)，~5s@60fps
const INVINCIBILITY_FRAMES = 60; // 受击无敌帧
const MAX_HP = 5;
const AUTO_FIRE_RATE = 8;   // 帧

// ── 元素类型 ────────────────────────────────────────────────
const FIRE = 'fire', ICE = 'ice';
const ELEM_COLORS = {
  fire:  { main:'#ff4422', glow:'#ff8866', dark:'#aa2200', bullet:'#ff6644', particle:'#ffaa33' },
  ice:   { main:'#2266ff', glow:'#6699ff', dark:'#0033aa', bullet:'#4488ff', particle:'#88ccff' },
  enemyF:'#ff5533',
  enemyI:'#3377ff',
  purple:'#cc44ff',
  gold:  '#ffe040',
};

// ── 全局状态 ────────────────────────────────────────────────
let canvas, ctx;
let player, enemies, enemyBullets, playerBullets, particles;
let score, wave, waveTimer, enemySpawnTimer, frameCount;
let ultimateCharge, ultimateActive, ultimateTimer;
let playerInvincible, invincibleTimer;
let gameRunning, gameOver;
let keys = {}, touches = {};
let touchActive = false, touchDX = 0, touchDY = 0;
let scale = 1, offsetX = 0, offsetY = 0;

// ── 对象池 ──────────────────────────────────────────────────
const poolEnemy = [], poolEnemyBullet = [], poolPlayerBullet = [], poolParticle = [];

function poolGet(arr, ctor) {
  return arr.length > 0 ? arr.pop() : new ctor();
}
function poolPut(arr, obj) {
  if (arr.length < 200) { obj.alive = false; arr.push(obj); }
}

// ── 实体类 ──────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = W/2; this.y = H * 0.78;
    this.w = 28; this.h = 32;
    this.elem = FIRE;
    this.vx = 0; this.vy = 0;
    this.fireTimer = 0;
    this.engineFlame = 0;
  }

  update() {
    // 移动
    let mx = 0, my = 0;
    if (touchActive) { mx = touchDX * 0.8; my = touchDY * 0.8; }
    if (keys['w']||keys['arrowup']) my -= PLAYER_SPD;
    if (keys['s']||keys['arrowdown']) my += PLAYER_SPD;
    if (keys['a']||keys['arrowleft']) mx -= PLAYER_SPD;
    if (keys['d']||keys['arrowright']) mx += PLAYER_SPD;

    // 平滑速度
    this.vx += (mx - this.vx) * 0.35;
    this.vy += (my - this.vy) * 0.35;
    this.x += this.vx;
    this.y += this.vy;

    // 边界限制
    this.x = Math.max(this.w/2, Math.min(W - this.w/2, this.x));
    this.y = Math.max(this.h/2, Math.min(H - this.h/2, this.y));

    // 无敌闪烁
    if (playerInvincible) invincibleTimer--;
    if (invincibleTimer <= 0) playerInvincible = false;

    // 大招计时
    if (ultimateActive) {
      ultimateTimer--;
      if (ultimateTimer <= 0) { ultimateActive = false; ultimateCharge = 0; updateUltUI(); }
    }

    // 自动射击
    this.fireTimer++;
    if (this.fireTimer >= (ultimateActive ? AUTO_FIRE_RATE * 0.4 : AUTO_FIRE_RATE)) {
      this.fireTimer = 0;
      this.shoot();
    }

    // 引擎火焰动画
    this.engineFlame += 0.3;
  }

  shoot() {
    let b = poolGet(poolPlayerBullet, PlayerBullet);
    b.init(this.x, this.y - this.h/2, this.elem);
    playerBullets.push(b);
    if (ultimateActive) {
      // 大招期间双翼射击
      let b2 = poolGet(poolPlayerBullet, PlayerBullet);
      b2.init(this.x - 12, this.y - this.h/2 + 4, this.elem);
      playerBullets.push(b2);
      let b3 = poolGet(poolPlayerBullet, PlayerBullet);
      b3.init(this.x + 12, this.y - this.h/2 + 4, this.elem);
      playerBullets.push(b3);
    }
  }

  draw(ctx) {
    if (playerInvincible && Math.floor(frameCount / 3) % 2 === 0) return;
    let c = ELEM_COLORS[this.elem];
    ctx.save();
    ctx.translate(this.x, this.y);

    // 引擎火焰
    let fl = 5 + Math.sin(this.engineFlame) * 3;
    ctx.fillStyle = ultimateActive ? '#ffee88' : c.glow;
    ctx.beginPath();
    ctx.moveTo(-6, this.h/2);
    ctx.lineTo(0, this.h/2 + fl + 8);
    ctx.lineTo(6, this.h/2);
    ctx.fill();
    // 内焰
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-3, this.h/2);
    ctx.lineTo(0, this.h/2 + fl + 2);
    ctx.lineTo(3, this.h/2);
    ctx.fill();

    // 机身
    let grad = ctx.createLinearGradient(0, -this.h/2, 0, this.h/2);
    grad.addColorStop(0, c.main); grad.addColorStop(0.5, c.glow); grad.addColorStop(1, c.dark);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -this.h/2);              // 机头
    ctx.lineTo(this.w/2, this.h/3);        // 右翼尖
    ctx.lineTo(this.w/4, this.h/2);        // 右尾
    ctx.lineTo(-this.w/4, this.h/2);       // 左尾
    ctx.lineTo(-this.w/2, this.h/3);       // 左翼尖
    ctx.closePath();
    ctx.fill();

    // 驾驶舱
    ctx.fillStyle = ultimateActive ? '#ffe080' : '#ddeeff';
    ctx.beginPath();
    ctx.ellipse(0, -4, 5, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(0, -6, 2, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // 护盾光环（无敌或大招时）
    if (playerInvincible || ultimateActive) {
      ctx.strokeStyle = ultimateActive ? ELEM_COLORS.gold : c.glow;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4 + Math.sin(frameCount * 0.2) * 0.3;
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 吸收范围指示
    ctx.strokeStyle = c.glow;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.arc(0, 0, ABSORB_RANGE, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  switchElem() {
    this.elem = this.elem === FIRE ? ICE : FIRE;
    updateElemUI();
    // 切换粒子
    for (let i = 0; i < 12; i++) {
      let p = poolGet(poolParticle, Particle);
      p.init(this.x, this.y, ELEM_COLORS[this.elem].particle, 1.5 + Math.random() * 2,
             Math.random() * Math.PI * 2, 15 + Math.random() * 20);
      particles.push(p);
    }
  }
}

class PlayerBullet {
  constructor() { this.alive = true; }
  init(x, y, elem) {
    this.x = x; this.y = y; this.elem = elem; this.alive = true;
    this.w = 4; this.h = 12;
  }
  update() {
    this.y -= BULLET_SPD;
    if (this.y < -20) { this.alive = false; poolPut(poolPlayerBullet, this); }
  }
  draw(ctx) {
    let c = ELEM_COLORS[this.elem];
    ctx.fillStyle = c.bullet;
    ctx.shadowColor = c.glow; ctx.shadowBlur = 6;
    ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
    ctx.shadowBlur = 0;
  }
}

class Enemy {
  constructor() { }
  init(x, y, elem, hp = 1) {
    this.x = x; this.y = y; this.elem = elem; this.alive = true;
    this.hp = hp; this.maxHp = hp;
    this.w = 26; this.h = 26;
    this.vx = 0; this.vy = 1.2 + Math.random() * 1.5;
    this.shootTimer = 40 + Math.random() * 80;
    this.shootInterval = 50 + Math.random() * 100;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpd = 0.02 + Math.random() * 0.04;
  }
  update() {
    this.y += this.vy;
    this.wobble += this.wobbleSpd;
    this.x += Math.sin(this.wobble) * 1.2;
    // 边界反弹
    if (this.x < this.w/2) { this.x = this.w/2; this.vx *= -1; }
    if (this.x > W - this.w/2) { this.x = W - this.w/2; this.vx *= -1; }

    this.shootTimer--;
    if (this.shootTimer <= 0) {
      this.shootTimer = this.shootInterval;
      this.shoot();
    }
    if (this.y > H + 40) { this.alive = false; poolPut(poolEnemy, this); }
  }
  shoot() {
    let b = poolGet(poolEnemyBullet, EnemyBullet);
    b.init(this.x, this.y + this.h/2, this.elem);
    enemyBullets.push(b);
  }
  draw(ctx) {
    let c = ELEM_COLORS[this.elem === FIRE ? 'enemyF' : 'enemyI'];
    ctx.save();
    ctx.translate(this.x, this.y);
    // 机身
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(0, this.h/2);   // 下尖
    ctx.lineTo(this.w/2, -this.h/3);
    ctx.lineTo(0, -this.h/2);   // 上尖
    ctx.lineTo(-this.w/2, -this.h/3);
    ctx.closePath();
    ctx.fill();
    // 核心
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI*2);
    ctx.fill();
    // 属性标记
    ctx.fillStyle = this.elem === FIRE ? '#ff4422' : '#2266ff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 血条
    if (this.maxHp > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(this.x - 12, this.y - this.h/2 - 8, 24, 3);
      ctx.fillStyle = this.elem === FIRE ? '#ff6644' : '#4488ff';
      ctx.fillRect(this.x - 12, this.y - this.h/2 - 8, 24 * (this.hp/this.maxHp), 3);
    }
  }
}

class EnemyBullet {
  constructor() { this.alive = true; }
  init(x, y, elem) {
    this.x = x; this.y = y; this.elem = elem; this.alive = true;
    this.r = 5; this.vy = ENEMY_BULLET_SPD;
  }
  update() {
    this.y += this.vy;
    if (this.y > H + 20 || this.y < -20 || this.x < -20 || this.x > W + 20) {
      this.alive = false; poolPut(poolEnemyBullet, this);
    }
  }
  draw(ctx) {
    let c = ELEM_COLORS[this.elem === FIRE ? 'enemyF' : 'enemyI'];
    ctx.fillStyle = c;
    ctx.shadowColor = c; ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Particle {
  constructor() { this.alive = true; }
  init(x, y, color, speed, angle, life) {
    this.x = x; this.y = y; this.color = color; this.alive = true;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = life; this.maxLife = life;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.97; this.vy *= 0.97;
    this.life--;
    if (this.life <= 0) { this.alive = false; poolPut(poolParticle, this); }
  }
  draw(ctx) {
    let alpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2 * alpha, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ── 星空背景 ────────────────────────────────────────────────
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, spd: 0.3 + Math.random() * 1.2,
                 r: 0.5 + Math.random() * 1.5, a: 0.3 + Math.random() * 0.7 });
  }
}

function drawStars(ctx) {
  for (let s of stars) {
    s.y += s.spd;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
}

// ── 游戏逻辑 ────────────────────────────────────────────────
function initGame() {
  player = new Player();
  enemies = []; enemyBullets = []; playerBullets = []; particles = [];
  score = 0; wave = 1; waveTimer = 0; enemySpawnTimer = 0; frameCount = 0;
  ultimateCharge = 0; ultimateActive = false; ultimateTimer = 0;
  playerInvincible = false; invincibleTimer = 0;
  gameRunning = true; gameOver = false;
  initStars();
  spawnWave();
  updateHUD();
}

function spawnWave() {
  let n = 4 + wave * 3;
  let elem = wave % 2 === 1 ? FIRE : ICE; // 奇数关火，偶数关冰
  for (let i = 0; i < n; i++) {
    let e = poolGet(poolEnemy, Enemy);
    e.init(40 + Math.random() * (W - 80), -40 - Math.random() * 300, elem, wave > 2 ? 2 : 1);
    enemies.push(e);
  }
  showMsg(elem === FIRE ? '🔥 第一关：烈焰初生' : '❄️ 第二关：冰封星海');
  updateHUD();
}

function showMsg(text) {
  let el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function update() {
  if (!gameRunning) return;
  frameCount++;

  // 更新实体
  player.update();

  for (let e of enemies) e.update();
  for (let b of enemyBullets) b.update();
  for (let b of playerBullets) b.update();
  for (let p of particles) p.update();

  // 清理死实体
  enemies = enemies.filter(e => e.alive);
  enemyBullets = enemyBullets.filter(b => b.alive);
  playerBullets = playerBullets.filter(b => b.alive);
  particles = particles.filter(p => p.alive);

  // 碰撞检测
  checkCollisions();

  // 敌人刷新
  enemySpawnTimer++;
  if (enemySpawnTimer >= ENEMY_SPAWN_RATE && enemies.length < 8 + wave * 2) {
    enemySpawnTimer = 0;
    let elem = wave % 2 === 1 ? FIRE : ICE;
    if (wave >= 3) elem = Math.random() > 0.5 ? FIRE : ICE; // 混合
    let e = poolGet(poolEnemy, Enemy);
    e.init(40 + Math.random() * (W - 80), -30, elem, wave > 2 ? 2 : 1);
    enemies.push(e);
  }

  // 波次检查
  if (enemies.length === 0) {
    waveTimer++;
    if (waveTimer > 120) {
      waveTimer = 0;
      wave++;
      spawnWave();
    }
  }
}

function checkCollisions() {
  // 玩家子弹 vs 敌人
  for (let b of playerBullets) {
    if (!b.alive) continue;
    for (let e of enemies) {
      if (!e.alive) continue;
      if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
        b.alive = false; poolPut(poolPlayerBullet, b);
        let dmg = (b.elem === e.elem) ? 2 : 1; // 同色双倍伤害
        e.hp -= dmg;
        if (e.hp <= 0) {
          e.alive = false; poolPut(poolEnemy, e);
          score += 100 * wave + (b.elem === e.elem ? 50 : 0);
          // 爆炸粒子
          for (let i = 0; i < 10; i++) {
            let p = poolGet(poolParticle, Particle);
            p.init(e.x, e.y, ELEM_COLORS[e.elem === FIRE ? 'enemyF' : 'enemyI'], 1+Math.random()*3, Math.random()*Math.PI*2, 12+Math.random()*15);
            particles.push(p);
          }
        }
        break;
      }
    }
  }

  // 敌人子弹 vs 玩家
  for (let b of enemyBullets) {
    if (!b.alive) continue;
    let dx = b.x - player.x, dy = b.y - player.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    // 同色吸收
    if (b.elem === player.elem && dist < ABSORB_RANGE) {
      b.alive = false; poolPut(poolEnemyBullet, b);
      ultimateCharge = Math.min(100, ultimateCharge + ULT_CHARGE_PER_BULLET);
      updateUltUI();
      // 吸收粒子
      for (let i = 0; i < 3; i++) {
        let p = poolGet(poolParticle, Particle);
        p.init(b.x, b.y, ELEM_COLORS[player.elem].particle, 0.5+Math.random(), Math.atan2(-dy, -dx)+Math.random()*0.5-0.25, 8+Math.random()*10);
        particles.push(p);
      }
      continue;
    }

    // 异色碰撞
    if (dist < player.w * 0.55 && !playerInvincible && !ultimateActive) {
      b.alive = false; poolPut(poolEnemyBullet, b);
      damagePlayer();
    }
  }

  // 敌人机身碰撞
  if (!playerInvincible && !ultimateActive) {
    for (let e of enemies) {
      if (!e.alive) continue;
      if (Math.abs(player.x - e.x) < (player.w + e.w)/2 * 0.7 &&
          Math.abs(player.y - e.y) < (player.h + e.h)/2 * 0.7) {
        e.alive = false; poolPut(poolEnemy, e);
        damagePlayer();
        for (let i = 0; i < 8; i++) {
          let p = poolGet(poolParticle, Particle);
          p.init(e.x, e.y, ELEM_COLORS[e.elem === FIRE ? 'enemyF' : 'enemyI'], 1+Math.random()*2.5, Math.random()*Math.PI*2, 10+Math.random()*12);
          particles.push(p);
        }
        break;
      }
    }
  }
}

let playerHP = MAX_HP;
function damagePlayer() {
  playerHP--;
  playerInvincible = true;
  invincibleTimer = INVINCIBILITY_FRAMES;
  // 受击粒子
  for (let i = 0; i < 15; i++) {
    let p = poolGet(poolParticle, Particle);
    p.init(player.x, player.y, '#ffffff', 2+Math.random()*3, Math.random()*Math.PI*2, 10+Math.random()*15);
    particles.push(p);
  }
  updateHUD();
  if (playerHP <= 0) endGame();
}

function activateUltimate() {
  if (ultimateCharge < 100 || ultimateActive) return;
  ultimateActive = true;
  ultimateTimer = ULT_DURATION;
  ultimateCharge = 0;
  // 清空异色弹幕
  enemyBullets = enemyBullets.filter(b => {
    if (b.elem !== player.elem) { b.alive = false; poolPut(poolEnemyBullet, b); return false; }
    return true;
  });
  // 效果粒子
  for (let i = 0; i < 30; i++) {
    let p = poolGet(poolParticle, Particle);
    let a = Math.random() * Math.PI * 2;
    p.init(player.x, player.y, ELEM_COLORS[player.elem].glow, 3+Math.random()*4, a, 20+Math.random()*30);
    particles.push(p);
  }
  updateUltUI();
  showMsg('⚡ 星核共鸣！');
}

function endGame() {
  gameRunning = false; gameOver = true;
  document.getElementById('final-score').textContent = `最终得分: ${score}`;
  document.getElementById('gameover').classList.add('show');
}

function restartGame() {
  document.getElementById('gameover').classList.remove('show');
  // 清理
  for (let e of enemies) { e.alive = false; poolPut(poolEnemy, e); }
  for (let b of enemyBullets) { b.alive = false; poolPut(poolEnemyBullet, b); }
  for (let b of playerBullets) { b.alive = false; poolPut(poolPlayerBullet, b); }
  for (let p of particles) { p.alive = false; poolPut(poolParticle, p); }
  playerHP = MAX_HP;
  initGame();
}

// ── 渲染 ────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // 星空背景
  drawStars(ctx);

  // 实体
  for (let b of playerBullets) b.draw(ctx);
  for (let b of enemyBullets) b.draw(ctx);
  for (let e of enemies) e.draw(ctx);
  player.draw(ctx);
  for (let p of particles) p.draw(ctx);
}

// ── UI 更新 ─────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hud-score').textContent = `🏆 ${score}`;
  document.getElementById('hud-wave').innerHTML = `WAVE ${wave}<br><span class="hud-label">${wave%2===1?'🔥 烈焰':'❄️ 冰霜'}${wave>=3?' · 混沌':''}</span>`;
}

function updateUltUI() {
  let bar = document.getElementById('ultimate-bar-fill');
  bar.style.width = ultimateCharge + '%';
  if (ultimateCharge >= 100) {
    bar.classList.add('ready');
    document.getElementById('btn-ult').classList.add('show');
  } else {
    bar.classList.remove('ready');
    document.getElementById('btn-ult').classList.remove('show');
  }
}

function updateElemUI() {
  let ind = document.getElementById('elem-indicator');
  ind.className = player.elem;
  document.getElementById('btn-fire').classList.toggle('active', player.elem === FIRE);
  document.getElementById('btn-ice').classList.toggle('active', player.elem === ICE);
}

// ── 输入处理 ────────────────────────────────────────────────
function initInput() {
  // 键盘
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key === 'j') { player.switchElem(); e.preventDefault(); }
    if (e.key === 'k' || e.key === 'shift') { activateUltimate(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // 触摸
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      touches[t.identifier] = { sx: t.clientX, sy: t.clientY, cx: t.clientX, cy: t.clientY };
    }
    if (e.touches.length === 1) touchActive = true;
  }, {passive: false});

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      if (touches[t.identifier]) {
        touches[t.identifier].cx = t.clientX;
        touches[t.identifier].cy = t.clientY;
        if (e.touches.length === 1) {
          touchDX = (t.clientX - touches[t.identifier].sx) / scale;
          touchDY = (t.clientY - touches[t.identifier].sy) / scale;
        }
      }
    }
  }, {passive: false});

  canvas.addEventListener('touchend', e => {
    for (let t of e.changedTouches) {
      let T = touches[t.identifier];
      if (T) {
        let dx = T.cx - T.sx, dy = T.cy - T.sy;
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          // Tap → 切换元素
          player.switchElem();
        }
        delete touches[t.identifier];
      }
    }
    if (Object.keys(touches).length === 0) { touchActive = false; touchDX = 0; touchDY = 0; }
  });

  // UI 按钮
  document.getElementById('btn-fire').addEventListener('click', () => { if (player.elem !== FIRE) player.switchElem(); });
  document.getElementById('btn-ice').addEventListener('click', () => { if (player.elem !== ICE) player.switchElem(); });
  document.getElementById('btn-ult').addEventListener('click', activateUltimate);
}

// ── 缩放适配 ────────────────────────────────────────────────
function resize() {
  let wrap = document.getElementById('game-wrap');
  let ww = window.innerWidth, wh = window.innerHeight;
  let rw, rh;
  if (ww / wh > 9/16) {
    rh = wh; rw = rh * 9/16;
  } else {
    rw = ww; rh = rw * 16/9;
  }
  wrap.style.width = rw + 'px';
  wrap.style.height = rh + 'px';
  scale = rw / W; // W=540
}

// ── 游戏循环 ────────────────────────────────────────────────
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ── 启动 ────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('gc');
  ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;

  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));

  initInput();
  initGame();
  gameLoop();
});

// 全局重启入口
window.restartGame = restartGame;
</script>
</body>
